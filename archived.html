<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مُدرَج — الفصول المؤرشفة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#16213E; --gold:#C9922B; --paper:#F7F4EC; --card:#FFFFFF; --text:#20242E; --text-mute:#5B6472; --line:#E4DFD1; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--paper); color:var(--text); min-height:100vh; }
  header{ background:var(--ink); color:#fff; padding:16px 32px; display:flex; align-items:center; gap:16px; }
  .back-btn{ background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }
  .head-title{ font-weight:600; font-size:16px; }
  main{ max-width:720px; margin:0 auto; padding:28px 20px; }
  .class-row{
    display:flex; align-items:center; justify-content:space-between; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:10px;
  }
  .c-name{ font-size:14.5px; font-weight:600; }
  .c-meta{ font-size:12px; color:var(--text-mute); font-weight:300; margin-top:3px; }
  .restore-btn{ padding:9px 16px; border:none; border-radius:8px; background:var(--ink); color:#fff; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
  .empty{ text-align:center; padding:60px 24px; background:var(--card); border:1px dashed var(--line); border-radius:14px; color:var(--text-mute); font-size:13.5px; font-weight:300; }
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/settings.html'">→</button>
  <div class="head-title">🗄️ الفصول المؤرشفة</div>
</header>
<main><div id="list">جارٍ التحميل...</div></main>
<script>
  const token = localStorage.getItem('mudraj_token');
  if(!token){ window.location.href = '/'; }

  async function api(path, options={}){
    const res = await fetch(path, { ...options, headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, ...(options.headers||{}) } });
    if(res.status === 401 || res.status === 403){ window.location.href = '/'; return; }
    return res.json();
  }

  async function load(){
    const data = await api('/api/classes/archived');
    const list = document.getElementById('list');
    if(!data || !data.success){ list.innerHTML = '<div class="empty">تعذر التحميل</div>'; return; }
    if(data.classes.length === 0){ list.innerHTML = '<div class="empty">ما فيه فصول مؤرشفة</div>'; return; }

    list.innerHTML = data.classes.map(c => `
      <div class="class-row">
        <div><div class="c-name">${c.name}</div><div class="c-meta">${c.studentCount} طالب</div></div>
        <button class="restore-btn" onclick="restore(${c.id})">↩️ استعادة</button>
      </div>
    `).join('');
  }

  async function restore(id){
    await api('/api/classes/' + id + '/archive', { method:'PUT' });
    load();
  }

  load();
</script>
</body>
</html>
