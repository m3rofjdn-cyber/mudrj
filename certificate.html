<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مُدرَج — شهادة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#16213E; --gold:#C9922B; --gold-soft:#E8C784; --paper:#F7F4EC; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--paper); min-height:100vh; }

  .toolbar{ padding:16px 24px; display:flex; gap:10px; justify-content:center; }
  .toolbar button{
    padding:10px 22px; border:none; border-radius:9px; font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn-print{ background:var(--ink); color:#fff; }
  .btn-back{ background:#fff; border:1px solid #E4DFD1 !important; color:#5B6472; }

  .certificate{
    max-width:1040px; aspect-ratio:297/210; margin:20px auto 60px; background:#fff; border:14px solid var(--gold);
    outline:2px solid var(--ink); outline-offset:-22px;
    padding:44px 70px; text-align:center; position:relative;
    display:flex; flex-direction:column; justify-content:center;
  }
  .cert-corner{ position:absolute; font-size:22px; color:var(--gold); }
  .cert-corner.tl{ top:16px; right:16px; } .cert-corner.tr{ top:16px; left:16px; }
  .cert-corner.bl{ bottom:16px; right:16px; } .cert-corner.br{ bottom:16px; left:16px; }

  .cert-mark{ font-size:13px; color:var(--ink); font-weight:600; letter-spacing:1px; margin-bottom:4px; }
  .cert-title{ font-family:'Amiri', serif; font-size:38px; color:var(--ink); font-weight:700; margin:10px 0 4px; }
  .cert-sub{ font-size:13.5px; color:#5B6472; font-weight:300; margin-bottom:20px; }
  .cert-line{ font-size:14px; color:#20242E; font-weight:300; margin-bottom:6px; }
  .cert-name{ font-family:'Amiri', serif; font-size:30px; color:var(--gold); font-weight:700; margin:8px 0 18px; border-bottom:2px solid var(--gold-soft); display:inline-block; padding-bottom:6px; }
  .cert-body{ font-size:14px; color:#20242E; font-weight:300; line-height:1.9; max-width:600px; margin:0 auto 22px; }
  .cert-footer{ display:flex; justify-content:space-around; margin-top:26px; padding:0 20px; font-size:12px; color:#5B6472; font-weight:300; }
  .cert-footer .box{ text-align:center; min-width:140px; }
  .cert-footer .val{ font-size:13px; color:#20242E; font-weight:600; margin-bottom:6px; }
  .cert-footer .line{ border-top:1px solid #ccc; margin-top:4px; padding-top:5px; }
  .cert-footer .sub-val{ font-size:10.5px; color:#8A93A0; font-weight:300; margin-top:2px; }

  @media print{
    .toolbar{ display:none; }
    body{ background:#fff; }
    .certificate{ margin:0 auto; box-shadow:none; }
  }
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/ui.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="toolbar">
  <button class="btn-back" onclick="history.back()">→ رجوع</button>
  <button class="btn-print" id="downloadBtn" onclick="downloadCertPdf()">⬇️ تنزيل PDF</button>
</div>

<div class="certificate" id="certificate">
  <div class="cert-corner tl">✦</div><div class="cert-corner tr">✦</div>
  <div class="cert-corner bl">✦</div><div class="cert-corner br">✦</div>

  <div class="cert-mark">مُدرَج</div>
  <div class="cert-title" id="certTitle">شهادة شكر وتقدير</div>
  <div class="cert-sub" id="certSub">تُمنح هذه الشهادة تقديرًا للجهد والالتزام</div>

  <div class="cert-line">تُقدَّم هذه الشهادة إلى الطالب</div>
  <div class="cert-name" id="studentName">...</div>

  <div class="cert-body" id="certBody">
    نظرًا لتميزه وحرصه المستمر خلال هذا الفصل الدراسي، نتقدم له بخالص الشكر والتقدير
    ونتمنى له دوام التوفيق والنجاح.
  </div>

  <div class="cert-footer">
    <div class="box"><div class="val" id="certDate">...</div><div class="line">التاريخ</div></div>
    <div class="box"><div class="val" id="teacherName">...</div><div class="line">المعلم</div></div>
    <div class="box"><div class="val" id="schoolName">...</div><div class="line">المدرسة</div><div class="sub-val" id="principalName"></div></div>
  </div>
</div>

<script>
  const token = localStorage.getItem('mudraj_token');
  if(!token){ window.location.href = '/'; }

  const params = new URLSearchParams(window.location.search);
  const studentId = params.get('id');
  const type = params.get('type') || 'thanks';

  if(type === 'success'){
    document.getElementById('certTitle').textContent = 'شهادة تهنئة بالنجاح';
    document.getElementById('certSub').textContent = 'تهنئة خاصة بمناسبة التفوق والنجاح';
    document.getElementById('certBody').textContent =
      'تهنئكم إدارة الفصل بمناسبة تفوقه ونجاحه هذا الفصل الدراسي، ونتمنى له مزيدًا من التقدم والتفوق في المراحل القادمة.';
  }

  let studentNameForFile = 'شهادة';

  document.getElementById('certDate').textContent = new Date().toLocaleDateString('ar-SA-u-ca-gregory', { year:'numeric', month:'long', day:'numeric' });

  async function loadStudent(){
    try{
      const res = await fetch('/api/students/' + studentId + '/profile', {
        headers:{ 'Authorization':'Bearer ' + token }
      });
      const data = await res.json();
      if(data && data.success){
        document.getElementById('studentName').textContent = data.student.name;
        studentNameForFile = data.student.name;
      }
    }catch(e){}
  }
  loadStudent();

  async function loadAccountInfo(){
    try{
      const res = await fetch('/api/account', { headers:{ 'Authorization':'Bearer ' + token } });
      const data = await res.json();
      if(data && data.success){
        document.getElementById('teacherName').textContent = data.account.firstName || data.account.username || '—';
        document.getElementById('schoolName').textContent = data.account.schoolName || '—';
        document.getElementById('principalName').textContent = data.account.principalName ? ('مدير المدرسة: ' + data.account.principalName) : '';
      }
    }catch(e){}
  }
  loadAccountInfo();

  async function downloadCertPdf(){
    const btn = document.getElementById('downloadBtn');
    const original = btn.textContent;
    btn.textContent = '⏳ جارٍ التجهيز...';
    btn.disabled = true;
    try{
      const el = document.getElementById('certificate');
      const canvas = await html2canvas(el, { scale: 3, backgroundColor: '#ffffff' });
      const imgData = canvas.toDataURL('image/png');

      // A4 عرضي حقيقي: 297×210 مم
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const pageWidth = 297, pageHeight = 210;
      const margin = 8;
      const availW = pageWidth - margin*2, availH = pageHeight - margin*2;
      const imgRatio = canvas.width / canvas.height;
      let drawW = availW, drawH = drawW / imgRatio;
      if(drawH > availH){ drawH = availH; drawW = drawH * imgRatio; }
      const x = (pageWidth - drawW) / 2, y = (pageHeight - drawH) / 2;

      pdf.addImage(imgData, 'PNG', x, y, drawW, drawH);
      const typeLabel = type === 'success' ? 'تهنئة-نجاح' : 'شهادة-شكر';
      pdf.save(`${typeLabel}-${studentNameForFile}.pdf`);
    }catch(e){
      await uiAlert('تعذر إنشاء ملف PDF، جرّب مرة أخرى');
    }
    btn.textContent = original;
    btn.disabled = false;
  }
</script>
</body>
</html>
