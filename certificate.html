<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مُدرَج — شهادة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#16213E; --gold:#C9922B; --gold-soft:#E8C784; --paper:#F7F4EC; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--paper); min-height:100vh; }

  .toolbar{ padding:16px 24px; display:flex; gap:10px; justify-content:center; }
  .toolbar button{
    padding:10px 22px; border:none; border-radius:9px; font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn-print{ background:var(--ink); color:#fff; }
  .btn-back{ background:#fff; border:1px solid #E4DFD1 !important; color:#5B6472; }

  .certificate{
    max-width:820px; margin:20px auto 60px; background:#fff; border:14px solid var(--gold);
    outline:2px solid var(--ink); outline-offset:-22px;
    padding:60px 50px; text-align:center; position:relative;
  }
  .cert-corner{ position:absolute; font-size:22px; color:var(--gold); }
  .cert-corner.tl{ top:16px; right:16px; } .cert-corner.tr{ top:16px; left:16px; }
  .cert-corner.bl{ bottom:16px; right:16px; } .cert-corner.br{ bottom:16px; left:16px; }

  .cert-mark{ font-size:14px; color:var(--ink); font-weight:600; letter-spacing:1px; margin-bottom:6px; }
  .cert-title{ font-family:'Amiri', serif; font-size:44px; color:var(--ink); font-weight:700; margin:18px 0 6px; }
  .cert-sub{ font-size:15px; color:#5B6472; font-weight:300; margin-bottom:34px; }
  .cert-line{ font-size:16px; color:#20242E; font-weight:300; margin-bottom:10px; }
  .cert-name{ font-family:'Amiri', serif; font-size:36px; color:var(--gold); font-weight:700; margin:14px 0 26px; border-bottom:2px solid var(--gold-soft); display:inline-block; padding-bottom:8px; }
  .cert-body{ font-size:16px; color:#20242E; font-weight:300; line-height:2; max-width:560px; margin:0 auto 30px; }
  .cert-footer{ display:flex; justify-content:space-between; margin-top:50px; padding:0 20px; font-size:12.5px; color:#5B6472; font-weight:300; }
  .cert-footer .box{ text-align:center; }
  .cert-footer .line{ width:140px; border-top:1px solid #ccc; margin-top:30px; padding-top:6px; }

  @media print{
    .toolbar{ display:none; }
    body{ background:#fff; }
    .certificate{ margin:0 auto; box-shadow:none; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn-back" onclick="history.back()">→ رجوع</button>
  <button class="btn-print" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
</div>

<div class="certificate" id="certificate">
  <div class="cert-corner tl">✦</div><div class="cert-corner tr">✦</div>
  <div class="cert-corner bl">✦</div><div class="cert-corner br">✦</div>

  <div class="cert-mark">مُدرَج</div>
  <div class="cert-title" id="certTitle">شهادة شكر وتقدير</div>
  <div class="cert-sub" id="certSub">تُمنح هذه الشهادة تقديرًا للجهد والالتزام</div>

  <div class="cert-line">تُقدَّم هذه الشهادة إلى الطالب</div>
  <div class="cert-name" id="studentName">...</div>

  <div class="cert-body" id="certBody">
    نظرًا لتميزه وحرصه المستمر خلال هذا الفصل الدراسي، نتقدم له بخالص الشكر والتقدير
    ونتمنى له دوام التوفيق والنجاح.
  </div>

  <div class="cert-footer">
    <div class="box"><div class="line">التاريخ</div></div>
    <div class="box" id="className"><div class="line">المعلم</div></div>
  </div>
</div>

<script>
  const token = localStorage.getItem('mudraj_token');
  if(!token){ window.location.href = '/'; }

  const params = new URLSearchParams(window.location.search);
  const studentId = params.get('id');
  const type = params.get('type') || 'thanks';

  if(type === 'success'){
    document.getElementById('certTitle').textContent = 'شهادة تهنئة بالنجاح';
    document.getElementById('certSub').textContent = 'تهنئة خاصة بمناسبة التفوق والنجاح';
    document.getElementById('certBody').textContent =
      'تهنئكم إدارة الفصل بمناسبة تفوقه ونجاحه هذا الفصل الدراسي، ونتمنى له مزيدًا من التقدم والتفوق في المراحل القادمة.';
  }

  async function loadStudent(){
    try{
      const res = await fetch('/api/students/' + studentId + '/profile', {
        headers:{ 'Authorization':'Bearer ' + token }
      });
      const data = await res.json();
      if(data && data.success){
        document.getElementById('studentName').textContent = data.student.name;
        document.getElementById('className').innerHTML = data.student.className + '<div class="line">الفصل</div>';
      }
    }catch(e){}
  }
  loadStudent();
</script>
</body>
</html>
