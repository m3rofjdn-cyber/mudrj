<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مُدرَج — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213E; --gold:#C9922B; --paper:#F7F4EC;
    --text:#20242E; --text-mute:#5B6472; --line:#E4DFD1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    background:var(--paper); color:var(--text);
    min-height:100vh;
  }
  header{
    background:var(--ink); color:#fff;
    padding:18px 32px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .mark{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:18px; }
  .mark .dot{ width:10px; height:10px; border-radius:3px; background:var(--gold); }
  .logout{
    background:none; border:1px solid rgba(255,255,255,0.25);
    color:#fff; padding:8px 16px; border-radius:8px;
    font-family:inherit; font-size:13.5px; cursor:pointer;
  }
  .logout:hover{ background:rgba(255,255,255,0.08); }
  main{
    max-width:640px; margin:64px auto; padding:0 24px; text-align:center;
  }
  .welcome-title{ font-size:26px; font-weight:600; margin-bottom:10px; }
  .welcome-sub{ color:var(--text-mute); font-size:15px; font-weight:300; }
  .card{
    margin-top:36px; background:#fff; border:1px solid var(--line);
    border-radius:14px; padding:28px; text-align:right;
  }
  .card h2{ font-size:15px; font-weight:600; margin-bottom:12px; }
  .card p{ color:var(--text-mute); font-size:13.5px; font-weight:300; line-height:1.8; }
</style>
</head>
<body>
  <header>
    <div class="mark"><span class="dot"></span><span>مُدرَج</span></div>
    <button class="logout" onclick="logout()">تسجيل الخروج</button>
  </header>
  <main>
    <div class="welcome-title" id="welcomeTitle">أهلاً بك</div>
    <div class="welcome-sub">تم تسجيل الدخول بنجاح والجلسة متصلة بالسيرفر وقاعدة البيانات.</div>
    <div class="card">
      <h2>هذه صفحة مؤقتة</h2>
      <p>هذي نقطة انطلاق بعد تسجيل الدخول. من هنا تقدر تبني صفحات الفصول والطلاب والدرجات فوق نفس نظام الجلسة (التوكن) الشغال حاليًا.</p>
    </div>
  </main>

<script>
  const token = localStorage.getItem('mudraj_token');
  const userRaw = localStorage.getItem('mudraj_user');
  if(!token){ window.location.href = '/'; }
  else {
    try{
      const user = JSON.parse(userRaw);
      document.getElementById('welcomeTitle').textContent = 'أهلاً، ' + (user.firstName || user.username);
    }catch(e){}
  }
  function logout(){
    localStorage.removeItem('mudraj_token');
    localStorage.removeItem('mudraj_user');
    window.location.href = '/';
  }
</script>
</body>
</html>
