<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مُدرَج — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --ink:#16213E;
    --ink-soft:#2A3A63;
    --gold:#C9922B;
    --gold-soft:#E8C784;
    --paper:#F7F4EC;
    --paper-card:#FFFFFF;
    --text:#20242E;
    --text-mute:#5B6472;
    --line:#E4DFD1;
    --danger:#B3432B;
    --danger-bg:#FBEAE4;
    --ok:#2F6E4F;
    --ok-bg:#E9F4EC;
    --radius:14px;
    --shadow: 0 20px 50px -20px rgba(22,33,62,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    background:var(--paper);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:stretch;
    line-height:1.6;
  }

  .screen{
    display:flex;
    width:100%;
    min-height:100vh;
  }

  /* ===== لوحة الهوية ===== */
  .brand{
    flex:1 1 46%;
    background:var(--ink);
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:56px 48px;
    overflow:hidden;
    color:#fff;
  }
  .brand-grid{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns:repeat(12,1fr);
    grid-template-rows:repeat(16,1fr);
    gap:1px;
    opacity:0.9;
  }
  .brand-grid span{
    border:1px solid rgba(255,255,255,0.045);
  }
  .brand-grid span.on{
    background:rgba(201,146,43,0.18);
    border-color:rgba(201,146,43,0.35);
  }
  .brand-grid span.on.strong{
    background:rgba(201,146,43,0.55);
    border-color:rgba(201,146,43,0.7);
  }
  .brand-top, .brand-bottom{ position:relative; z-index:2; }
  .brand-mark{
    display:flex; align-items:center; gap:12px;
  }
  .brand-mark .dot{
    width:11px; height:11px; border-radius:3px;
    background:var(--gold);
  }
  .brand-mark span{
    font-size:20px; font-weight:600; letter-spacing:0;
  }
  .brand-headline{
    margin-top:64px;
    font-size:34px;
    font-weight:600;
    max-width:420px;
    line-height:1.45;
  }
  .brand-headline em{
    font-style:normal;
    color:var(--gold-soft);
  }
  .brand-sub{
    margin-top:18px;
    font-size:15px;
    color:rgba(255,255,255,0.6);
    max-width:380px;
    font-weight:300;
  }
  .brand-bottom{
    font-size:13px;
    color:rgba(255,255,255,0.42);
    font-weight:300;
  }

  /* ===== لوحة النموذج ===== */
  .panel{
    flex:1 1 54%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
  }
  .card{
    width:100%;
    max-width:400px;
  }
  .card-head{ margin-bottom:28px; }
  .card-head h1{
    font-size:24px;
    font-weight:600;
    margin-bottom:6px;
  }
  .card-head p{
    color:var(--text-mute);
    font-size:14.5px;
    font-weight:300;
  }

  .tabs{
    display:flex;
    border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:12px 8px;
    font-size:14.5px;
    font-weight:500;
    color:var(--text-mute);
    background:none;
    border:none;
    cursor:pointer;
    position:relative;
    font-family:inherit;
    transition:color .15s ease;
  }
  .tab.active{ color:var(--ink); }
  .tab::after{
    content:"";
    position:absolute;
    right:0; left:0; bottom:-1px;
    height:2px;
    background:var(--gold);
    transform:scaleX(0);
    transition:transform .2s ease;
  }
  .tab.active::after{ transform:scaleX(1); }

  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--text-mute);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    font-family:inherit;
    font-size:14.5px;
    background:var(--paper-card);
    color:var(--text);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{
    outline:none;
    border-color:var(--ink-soft);
    box-shadow:0 0 0 3px rgba(22,33,62,0.08);
  }
  .field-row{
    display:flex;
    gap:12px;
  }
  .field-row .field{ flex:1; }

  .btn-primary{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--ink);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:background .15s ease, transform .1s ease;
    margin-top:6px;
  }
  .btn-primary:hover{ background:var(--ink-soft); }
  .btn-primary:active{ transform:scale(0.99); }
  .btn-primary:disabled{
    opacity:0.75;
    cursor:default;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin:22px 0;
    color:var(--text-mute);
    font-size:12.5px;
    font-weight:300;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  #googleBtnBox{
    display:flex;
    justify-content:center;
  }

  .alert{
    display:none;
    padding:12px 14px;
    border-radius:10px;
    font-size:13.5px;
    margin-bottom:18px;
    font-weight:500;
    align-items:center;
    gap:8px;
  }
  .alert.show{ display:flex; }
  .alert.error{ background:var(--danger-bg); color:var(--danger); }
  .alert.success{ background:var(--ok-bg); color:var(--ok); }

  .spinner{
    width:16px; height:16px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.35);
    border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .switch-hint{
    text-align:center;
    margin-top:22px;
    font-size:13.5px;
    color:var(--text-mute);
    font-weight:300;
  }
  .switch-hint button{
    background:none; border:none;
    color:var(--ink); font-weight:600;
    cursor:pointer; font-family:inherit;
    font-size:13.5px;
  }

  @media (max-width:900px){
    .brand{ display:none; }
    .panel{ padding:32px 20px; }
  }
</style>
</head>
<body>

<div class="screen">

  <!-- لوحة الهوية -->
  <aside class="brand">
    <div class="brand-grid" id="brandGrid"></div>
    <div class="brand-top">
      <div class="brand-mark"><span class="dot"></span><span>مُدرَج</span></div>
      <div class="brand-headline">كل حصة، كل طالب، <em>بمكانه الصحيح.</em></div>
      <div class="brand-sub">نظام إدارة كشوفات وتقييم مبني للمعلم — فصولك ودرجات طلابك بمكان واحد منظّم.</div>
    </div>
    <div class="brand-bottom">مُدرَج © 2026</div>
  </aside>

  <!-- لوحة النموذج -->
  <main class="panel">
    <div class="card">

      <div class="card-head" id="cardHead">
        <h1 id="headTitle">تسجيل الدخول</h1>
        <p id="headSub">أدخل بيانات حسابك للمتابعة</p>
      </div>

      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">تسجيل الدخول</button>
        <button class="tab" id="tabRegister" onclick="switchTab('register')">حساب جديد</button>
      </div>

      <div class="alert" id="alertBox"></div>

      <!-- نموذج الدخول -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="loginUsername">اسم المستخدم</label>
          <input id="loginUsername" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPassword">كلمة المرور</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit" id="loginBtn">
          <span id="loginBtnText">دخول</span>
        </button>
      </form>

      <!-- نموذج إنشاء حساب -->
      <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
        <div class="field-row">
          <div class="field">
            <label for="regFirst">الاسم الأول</label>
            <input id="regFirst" type="text" required>
          </div>
          <div class="field">
            <label for="regLast">الاسم الأخير</label>
            <input id="regLast" type="text">
          </div>
        </div>
        <div class="field">
          <label for="regUsername">اسم المستخدم</label>
          <input id="regUsername" type="text" autocomplete="username" required minlength="3">
        </div>
        <div class="field">
          <label for="regPassword">كلمة المرور</label>
          <input id="regPassword" type="password" autocomplete="new-password" required minlength="6">
        </div>
        <button class="btn-primary" type="submit" id="registerBtn">
          <span id="registerBtnText">إنشاء الحساب</span>
        </button>
      </form>

      <div class="divider">أو</div>

      <div id="googleBtnBox"></div>

      <p class="switch-hint" id="switchHint">
        ما عندك حساب؟ <button onclick="switchTab('register')">أنشئ واحد</button>
      </p>

    </div>
  </main>

</div>

<script>
  // ===== نمط الشبكة الخلفي (يتولد عشوائياً مرة واحدة) =====
  (function buildGrid(){
    const grid = document.getElementById('brandGrid');
    const total = 12 * 16;
    for(let i=0;i<total;i++){
      const cell = document.createElement('span');
      const r = Math.random();
      if(r > 0.965) cell.className = 'on strong';
      else if(r > 0.90) cell.className = 'on';
      grid.appendChild(cell);
    }
  })();

  // ===== التبويبات =====
  function switchTab(tab){
    const isLogin = tab === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabRegister').classList.toggle('active', !isLogin);
    document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
    document.getElementById('headTitle').textContent = isLogin ? 'تسجيل الدخول' : 'إنشاء حساب جديد';
    document.getElementById('headSub').textContent = isLogin ? 'أدخل بيانات حسابك للمتابعة' : 'ما تحتاج بريد إلكتروني — بس اسم مستخدم وكلمة مرور';
    document.getElementById('switchHint').innerHTML = isLogin
      ? 'ما عندك حساب؟ <button onclick="switchTab(\'register\')">أنشئ واحد</button>'
      : 'عندك حساب؟ <button onclick="switchTab(\'login\')">سجّل دخولك</button>';
    hideAlert();
  }

  function showAlert(message, type){
    const box = document.getElementById('alertBox');
    box.textContent = message;
    box.className = 'alert show ' + type;
  }
  function hideAlert(){
    const box = document.getElementById('alertBox');
    box.className = 'alert';
  }

  function setLoading(btn, textEl, loading, loadingText, normalText){
    btn.disabled = loading;
    if(loading){
      textEl.innerHTML = '<span class="spinner"></span>' + loadingText;
    } else {
      textEl.textContent = normalText;
    }
  }

  function saveSession(token, user){
    localStorage.setItem('mudraj_token', token);
    localStorage.setItem('mudraj_user', JSON.stringify(user));
  }

  function goToApp(){
    window.location.href = '/dashboard.html';
  }

  // ===== تسجيل الدخول =====
  async function handleLogin(e){
    e.preventDefault();
    hideAlert();
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    setLoading(btn, btnText, true, 'جارٍ الدخول...', 'دخول');
    try{
      const res = await fetch('/api/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if(!data.success){
        showAlert(data.message || 'تعذر تسجيل الدخول', 'error');
        return;
      }
      saveSession(data.token, data.user);
      showAlert('تم تسجيل الدخول، جارٍ التحويل...', 'success');
      setTimeout(goToApp, 500);
    } catch(err){
      showAlert('تعذر الاتصال بالسيرفر، حاول مرة أخرى', 'error');
    } finally {
      setLoading(btn, btnText, false, '', 'دخول');
    }
  }

  // ===== إنشاء حساب =====
  async function handleRegister(e){
    e.preventDefault();
    hideAlert();
    const btn = document.getElementById('registerBtn');
    const btnText = document.getElementById('registerBtnText');
    const firstName = document.getElementById('regFirst').value.trim();
    const lastName = document.getElementById('regLast').value.trim();
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value;

    setLoading(btn, btnText, true, 'جارٍ الإنشاء...', 'إنشاء الحساب');
    try{
      const res = await fetch('/api/register', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ firstName, lastName, username, password })
      });
      const data = await res.json();
      if(!data.success){
        showAlert(data.message || 'تعذر إنشاء الحساب', 'error');
        return;
      }
      showAlert('تم إنشاء الحساب بنجاح! يمكنك الدخول الآن', 'success');
      setTimeout(()=>{
        switchTab('login');
        document.getElementById('loginUsername').value = username;
      }, 900);
    } catch(err){
      showAlert('تعذر الاتصال بالسيرفر، حاول مرة أخرى', 'error');
    } finally {
      setLoading(btn, btnText, false, '', 'إنشاء الحساب');
    }
  }

  // ===== تسجيل الدخول بقوقل =====
  async function handleCredentialResponse(response){
    hideAlert();
    showAlert('جارٍ التحقق من حساب قوقل...', 'success');
    try{
      const res = await fetch('/api/auth/google', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token: response.credential })
      });
      const data = await res.json();
      if(!data.success){
        showAlert(data.message || 'فشل تسجيل الدخول بقوقل', 'error');
        return;
      }
      saveSession(data.token, data.user);
      showAlert('تم تسجيل الدخول، جارٍ التحويل...', 'success');
      setTimeout(goToApp, 500);
    } catch(err){
      showAlert('تعذر الاتصال بالسيرفر، حاول مرة أخرى', 'error');
    }
  }

  window.onload = function(){
    if(window.google && google.accounts){
      google.accounts.id.initialize({
        client_id: '821921990770-822776a7seho4i8les9lbqjsnut2lv23.apps.googleusercontent.com',
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById('googleBtnBox'),
        { theme:'outline', size:'large', shape:'pill', text:'continue_with', locale:'ar', width:320 }
      );
    }

    const existingToken = localStorage.getItem('mudraj_token');
    if(existingToken){ goToApp(); }
  };
</script>
</body>
</html>
