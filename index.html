<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مُدرج - نظام إدارة الكشوفات الذكي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

  <!-- الهيدر العلوي -->
  <header class="p-5 bg-white border-b border-slate-200 shadow-sm max-w-7xl mx-auto w-full flex justify-between items-center rounded-b-2xl">
    <div class="flex items-center space-x-3 space-x-reverse">
      <div class="w-10 h-10 bg-emerald-600 text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-md">مـ</div>
      <span class="text-2xl font-extrabold tracking-wide text-emerald-700">مُدرَج</span>
    </div>
    <div id="authNavButtons" class="flex items-center space-x-2 space-x-reverse bg-slate-100 p-1.5 rounded-xl border border-slate-200">
      <button id="btnTabLogin" onclick="showTab('login')" class="px-5 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-white shadow">تسجيل الدخول</button>
      <button id="btnTabRegister" onclick="showTab('register')" class="px-5 py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900">إنشاء حساب</button>
    </div>
    <div id="userHeaderInfo" class="hidden flex items-center gap-4">
      <span id="headerUserName" class="text-sm font-bold text-emerald-700"></span>
      <button onclick="handleLogout()" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-xl text-xs font-bold transition">تسجيل خروج</button>
    </div>
  </header>

  <!-- الحاوية الرئيسية -->
  <main id="mainContainer" class="max-w-md mx-auto w-full px-4 py-8 my-auto">
    
    <!-- 1. نموذج الدخول والتسجيل -->
    <div id="authCard" class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
      <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium border text-center transition-all"></div>

      <div id="googleAuthSection" class="space-y-4 text-center pb-4 border-b border-slate-100">
        <p class="text-xs text-slate-500 font-medium">الدخول السريع بنقرة واحدة</p>
        <div class="flex justify-center">
          <div id="g_id_onload"
               data-client_id="821921990770-822776a7seho4i8les9lbqjsnut2lv23.apps.googleusercontent.com"
               data-callback="handleCredentialResponse"
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular"></div>
        </div>
        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-4 text-slate-400 text-xs">أو اسم المستخدم</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>
      </div>

      <!-- نموذج تسجيل الدخول -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 mt-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">اسم المستخدم</label>
          <input type="text" id="loginId" required placeholder="ادخل username" class="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 focus:border-emerald-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">كلمة المرور</label>
          <input type="password" id="loginPass" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 focus:border-emerald-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 transition">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold transition shadow-lg shadow-emerald-600/20">دخول</button>
      </form>

      <!-- نموذج إنشاء حساب -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3 mt-4 hidden">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">الاسم الأول</label>
            <input type="text" id="regFirstName" required class="w-full px-3.5 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">الاسم الأخير</label>
            <input type="text" id="regLastName" required class="w-full px-3.5 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">اسم المستخدم</label>
          <input type="text" id="regUser" required placeholder="ادخل username" class="w-full px-3.5 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">كلمة المرور</label>
          <input type="password" id="regPass" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold transition shadow-lg shadow-emerald-600/20">إنشاء حساب</button>
      </form>
    </div>

    <!-- 2. واجهة المعلم الرئيسية (الفصول) -->
    <div id="teacherDashboard" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <div>
          <h1 class="text-2xl font-extrabold text-slate-800">فصولي الدراسية</h1>
          <p class="text-slate-500 text-sm">اختر فصلاً لإدارته أو قم بإضافة فصل جديد</p>
        </div>
        <button onclick="openAddClassModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl shadow-md transition flex items-center gap-2">
          <span>+ إضافة فصل</span>
        </button>
      </div>

      <div id="classesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </div>

    <!-- 3. واجهة الفصل التفصيلية -->
    <div id="classDetailView" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
          <button onclick="backToClasses()" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-sm transition">← رجوع للفصول</button>
          <h2 id="currentClassName" class="text-2xl font-extrabold text-emerald-800"></h2>
        </div>
        
        <!-- التبويبات -->
        <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-bold gap-1">
          <button id="tabBtnStudents" onclick="switchClassTab('students')" class="px-4 py-2 rounded-lg bg-emerald-600 text-white shadow">الطلاب والتقييم</button>
          <button id="tabBtnLeaderboard" onclick="switchClassTab('leaderboard')" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900">ليدربورد 🏆</button>
          <button id="tabBtnAttendance" onclick="switchClassTab('attendance')" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900">التحضير 📋</button>
          <button id="tabBtnWheel" onclick="switchClassTab('wheel')" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900">العجلة 🎡</button>
        </div>

        <button onclick="openAddStudentModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow transition">+ إضافة طالب</button>
      </div>

      <!-- تبويب الطلاب -->
      <div id="tabContentStudents" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

      <!-- تبويب الليدربورد -->
      <div id="tabContentLeaderboard" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4 max-w-2xl mx-auto">
        <h3 class="text-xl font-bold text-slate-800 text-center">🏆 ليدربورد الأوسمة والدرجات</h3>
        <div id="leaderboardList" class="space-y-2"></div>
      </div>

      <!-- تبويب التحضير -->
      <div id="tabContentAttendance" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-3xl mx-auto space-y-4">
        <div class="flex justify-between items-center border-b pb-4">
          <h3 class="text-xl font-bold text-slate-800">📋 كشف التحضير اليومي</h3>
          <button onclick="alert('تم حفظ كشف التحضير بنجاح!')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl">حفظ التحضير</button>
        </div>
        <div id="attendanceList" class="space-y-2"></div>
      </div>

      <!-- تبويب العجلة العشوائية -->
      <div id="tabContentWheel" class="hidden bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center max-w-md mx-auto space-y-6">
        <h3 class="text-xl font-bold text-slate-800">🎡 عجلة الاختيار العشوائي</h3>
        <div class="relative w-64 h-64 mx-auto border-4 border-emerald-500 rounded-full flex items-center justify-center bg-emerald-50 shadow-inner overflow-hidden">
          <div id="wheelWinner" class="text-2xl font-extrabold text-emerald-700 transition-all">اضغط على تدوير</div>
        </div>
        <button onclick="spinWheel()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition">تدوير العجلة 🚀</button>
      </div>
    </div>

  </main>

  <!-- النافذة المنبثقة: إضافة فصل -->
  <div id="addClassModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-slate-800">إضافة فصل جديد</h3>
      <input type="text" id="classNameInput" placeholder="اسم الفصل (مثال: أول متوسط / 1)" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500">
      <div class="flex gap-2 justify-end">
        <button onclick="closeAddClassModal()" class="px-4 py-2 text-slate-500 text-sm font-bold">إلغاء</button>
        <button onclick="submitCreateClass()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm">حفظ</button>
      </div>
    </div>
  </div>

  <!-- النافذة المنبثقة: إضافة طالب -->
  <div id="addStudentModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-slate-800">إضافة طالب جديد</h3>
      <input type="text" id="studentNameInput" placeholder="اسم الطالب الثلاثي" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500">
      <div class="flex gap-2 justify-end">
        <button onclick="closeAddStudentModal()" class="px-4 py-2 text-slate-500 text-sm font-bold">إلغاء</button>
        <button onclick="submitAddStudent()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm">إضافة الطالب</button>
      </div>
    </div>
  </div>

  <!-- الفوتر -->
  <footer class="p-4 text-center text-slate-400 text-xs border-t border-slate-200 bg-white">
    جميع الحقوق محفوظة منصة مُدرج © 2026
  </footer>

  <script>
    const API_URL = window.location.origin.includes('localhost') ? 'http://localhost:3000' : window.location.origin;

    let currentClasses = [];
    let selectedClass = null;

    window.onload = () => {
      const token = localStorage.getItem('userToken');
      const savedUser = localStorage.getItem('userName');
      if (token && savedUser) {
        showDashboard(savedUser);
      }
    };

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      box.innerText = msg;
      box.className = `mb-6 p-4 rounded-xl text-sm font-medium border text-center transition-all ${
        isSuccess ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-rose-50 border-rose-200 text-rose-700'
      }`;
      box.classList.remove('hidden');
    }

    function showTab(type) {
      document.getElementById('alertBox').classList.add('hidden');
      const isLogin = type === 'login';
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('registerForm').classList.toggle('hidden', isLogin);
      document.getElementById('btnTabLogin').className = isLogin ? 'px-5 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-white shadow' : 'px-5 py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900';
      document.getElementById('btnTabRegister').className = !isLogin ? 'px-5 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-white shadow' : 'px-5 py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900';
    }

    async function handleCredentialResponse(response) {
      try {
        const res = await fetch(`${API_URL}/api/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: response.credential })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('userToken', data.token);
          localStorage.setItem('userName', data.user.firstName);
          showDashboard(data.user.firstName);
        } else {
          showAlert(data.message);
        }
      } catch (err) { showAlert('تعذر التوثيق عبر Google'); }
    }

    async function handleLogin(e) {
      e.preventDefault();
      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginId').value,
            password: document.getElementById('loginPass').value
          })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('userToken', data.token);
          localStorage.setItem('userName', data.user.firstName);
          showDashboard(data.user.firstName);
        } else {
          showAlert(data.message);
        }
      } catch (err) { showAlert('تعذر تسجيل الدخول'); }
    }

    async function handleRegister(e) {
      e.preventDefault();
      try {
        const res = await fetch(`${API_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName: document.getElementById('regFirstName').value,
            lastName: document.getElementById('regLastName').value,
            username: document.getElementById('regUser').value,
            password: document.getElementById('regPass').value
          })
        });
        const data = await res.json();
        if (data.success) {
          showAlert(data.message, true);
          setTimeout(() => showTab('login'), 1500);
        } else {
          showAlert(data.message);
        }
      } catch (err) { showAlert('حدث خطأ بالإنشاء'); }
    }

    function showDashboard(name) {
      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('authNavButtons').classList.add('hidden');
      document.getElementById('mainContainer').className = "max-w-7xl mx-auto w-full px-4 py-8";
      document.getElementById('userHeaderInfo').classList.remove('hidden');
      document.getElementById('headerUserName').innerText = `المعلم: ${name}`;
      document.getElementById('teacherDashboard').classList.remove('hidden');
      loadClasses();
    }

    async function loadClasses() {
      const token = localStorage.getItem('userToken');
      try {
        const res = await fetch(`${API_URL}/api/classes`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          currentClasses = data.classes;
          renderClasses();
        }
      } catch (err) { console.error(err); }
    }

    function renderClasses() {
      const container = document.getElementById('classesList');
      if (currentClasses.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 bg-white rounded-2xl border border-slate-200"><p class="text-slate-500 font-medium">لا توجد فصول حالياً.</p><p class="text-xs text-slate-400 mt-1">اضغط على زر "+ إضافة فصل" للبدء.</p></div>`;
        return;
      }
      container.innerHTML = currentClasses.map(cls => `
        <div onclick="openClassView(${cls.id})" class="bg-white p-6 rounded-2xl border border-slate-200 hover:border-emerald-500 hover:shadow-lg transition cursor-pointer flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-xl font-bold text-slate-800">${cls.name}</h3>
              <span class="text-xs px-2.5 py-1 bg-emerald-50 text-emerald-700 font-bold rounded-lg">${cls.students ? cls.students.length : 0} طالب</span>
            </div>
            <p class="text-xs text-slate-400">اضغط لفتح الفصل وإدارة الطلاب والتقييمات</p>
          </div>
        </div>
      `).join('');
    }

    function openClassView(classId) {
      selectedClass = currentClasses.find(c => c.id === classId);
      document.getElementById('teacherDashboard').classList.add('hidden');
      document.getElementById('classDetailView').classList.remove('hidden');
      document.getElementById('currentClassName').innerText = selectedClass.name;
      switchClassTab('students');
    }

    function backToClasses() {
      document.getElementById('classDetailView').classList.add('hidden');
      document.getElementById('teacherDashboard').classList.remove('hidden');
      loadClasses();
    }

    function switchClassTab(tab) {
      const tabs = ['students', 'leaderboard', 'attendance', 'wheel'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tabBtn${t.charAt(0).toUpperCase() + t.slice(1)}`);
        const content = document.getElementById(`tabContent${t.charAt(0).toUpperCase() + t.slice(1)}`);
        if (t === tab) {
          btn.className = "px-4 py-2 rounded-lg bg-emerald-600 text-white shadow font-bold";
          content.classList.remove('hidden');
        } else {
          btn.className = "px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 font-bold";
          content.classList.add('hidden');
        }
      });

      if (tab === 'students') renderStudentsCards();
      if (tab === 'leaderboard') renderLeaderboard();
      if (tab === 'attendance') renderAttendance();
    }

    function renderStudentsCards() {
      const container = document.getElementById('tabContentStudents');
      if (!selectedClass.students || selectedClass.students.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center py-8 text-slate-400">لا يوجد طلاب في هذا الفصل بعد.</p>`;
        return;
      }
      container.innerHTML = selectedClass.students.map(s => `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <h4 class="font-bold text-slate-800">${s.name}</h4>
            <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">⭐ ${s.score || 0}</span>
          </div>
          <div class="grid grid-cols-2 gap-2 text-xs font-bold">
            <button onclick="updateScore(${s.id}, 5)" class="p-2 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-xl border border-amber-200">⭐ نجمة (+5)</button>
            <button onclick="updateScore(${s.id}, 2)" class="p-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl border border-emerald-200">✓ ممتاز (+2)</button>
            <button onclick="updateScore(${s.id}, 3)" class="p-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-xl border border-blue-200">📚 أكمل الواجب (+3)</button>
            <button onclick="updateScore(${s.id}, -2)" class="p-2 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-xl border border-rose-200">✕ خطأ (-2)</button>
          </div>
        </div>
      `).join('');
    }

    async function updateScore(studentId, points) {
      const token = localStorage.getItem('userToken');
      try {
        const res = await fetch(`${API_URL}/api/students/score`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ studentId, points })
        });
        const data = await res.json();
        if (data.success) {
          const student = selectedClass.students.find(s => s.id === studentId);
          if (student) student.score = (student.score || 0) + points;
          renderStudentsCards();
        }
      } catch (err) { console.error(err); }
    }

    function renderLeaderboard() {
      const container = document.getElementById('leaderboardList');
      const sorted = [...(selectedClass.students || [])].sort((a,b) => (b.score || 0) - (a.score || 0));
      container.innerHTML = sorted.map((s, idx) => `
        <div class="flex justify-between items-center p-3 ${idx === 0 ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-200'} border rounded-xl font-bold">
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-full ${idx === 0 ? 'bg-amber-500' : 'bg-slate-400'} text-white text-xs flex items-center justify-center">${idx + 1}</span>
            <span class="text-slate-800">${s.name}</span>
          </div>
          <span class="text-emerald-600">⭐ ${s.score || 0} نقطة</span>
        </div>
      `).join('');
    }

    function renderAttendance() {
      const container = document.getElementById('attendanceList');
      if (!selectedClass.students || selectedClass.students.length === 0) {
        container.innerHTML = `<p class="text-center py-4 text-slate-400">لا يوجد طلاب للتحضير.</p>`;
        return;
      }
      container.innerHTML = selectedClass.students.map(s => `
        <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-200">
          <span class="font-bold text-slate-800 text-sm">${s.name}</span>
          <div class="flex gap-4">
            <label class="flex items-center gap-1.5 text-xs font-bold text-emerald-600 cursor-pointer"><input type="radio" name="att_${s.id}" value="present" checked class="accent-emerald-600"> حاضر</label>
            <label class="flex items-center gap-1.5 text-xs font-bold text-rose-600 cursor-pointer"><input type="radio" name="att_${s.id}" value="absent" class="accent-rose-600"> غائب</label>
          </div>
        </div>
      `).join('');
    }

    function spinWheel() {
      const winnerDiv = document.getElementById('wheelWinner');
      const students = selectedClass.students;
      if (!students || students.length === 0) {
        winnerDiv.innerText = "لا يوجد طلاب";
        return;
      }
      winnerDiv.innerText = "جاري الاختيار...";
      setTimeout(() => {
        const random = students[Math.floor(Math.random() * students.length)];
        winnerDiv.innerText = `🎉 ${random.name}`;
      }, 1000);
    }

    function openAddClassModal() { document.getElementById('addClassModal').classList.remove('hidden'); }
    function closeAddClassModal() { document.getElementById('addClassModal').classList.add('hidden'); }
    function openAddStudentModal() { document.getElementById('addStudentModal').classList.remove('hidden'); }
    function closeAddStudentModal() { document.getElementById('addStudentModal').classList.add('hidden'); }

    async function submitCreateClass() {
      const name = document.getElementById('classNameInput').value.trim();
      if (!name) return alert('يرجى كتابة اسم الفصل');
      const token = localStorage.getItem('userToken');
      try {
        const res = await fetch(`${API_URL}/api/classes`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (data.success) {
          closeAddClassModal();
          document.getElementById('classNameInput').value = '';
          await loadClasses();
        } else {
          alert(data.message || 'حدث خطأ أثناء إضافة الفصل');
        }
      } catch (err) { alert('تعذر الاتصال بالسيرفر لإضافة الفصل.'); }
    }

    async function submitAddStudent() {
      const name = document.getElementById('studentNameInput').value.trim();
      if (!name || !selectedClass) return alert('يرجى كتابة اسم الطالب');
      const token = localStorage.getItem('userToken');
      try {
        const res = await fetch(`${API_URL}/api/students`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ classId: selectedClass.id, name })
        });
        const data = await res.json();
        if (data.success) {
          closeAddStudentModal();
          document.getElementById('studentNameInput').value = '';
          if (!selectedClass.students) selectedClass.students = [];
          selectedClass.students.push(data.student);
          renderStudentsCards();
        } else {
          alert(data.message || 'حدث خطأ أثناء إضافة الطالب');
        }
      } catch (err) { alert('تعذر الاتصال بالسيرفر لإضافة الطالب.'); }
    }

    function handleLogout() {
      localStorage.removeItem('userToken');
      localStorage.removeItem('userName');
      location.reload();
    }
  </script>
</body>
</html>
