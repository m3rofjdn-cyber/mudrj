<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مُدرج - نظام إدارة الكشوفات الذكي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

  <!-- خلفية جمالية -->
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
  </div>

  <!-- Header -->
  <header class="p-6 flex justify-between items-center max-w-6xl mx-auto w-full">
    <div class="flex items-center space-x-3 space-x-reverse">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-500/30">مـ</div>
      <span class="text-2xl font-extrabold tracking-wide bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">مُدرَج</span>
    </div>
    <div id="authNavButtons" class="flex items-center space-x-3 space-x-reverse bg-slate-900/60 p-1.5 rounded-xl border border-slate-800">
      <button id="btnTabLogin" onclick="showTab('login')" class="px-5 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-blue-600 text-white shadow-md">تسجيل الدخول</button>
      <button id="btnTabRegister" onclick="showTab('register')" class="px-5 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all duration-200">إنشاء حساب</button>
    </div>
    <div id="userHeaderInfo" class="hidden flex items-center gap-4">
      <span id="headerUserName" class="text-sm font-bold text-blue-400"></span>
      <button onclick="handleLogout()" class="px-4 py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 rounded-xl text-xs font-bold transition">تسجيل خروج</button>
    </div>
  </header>

  <!-- Main Box -->
  <main id="mainContainer" class="max-w-md mx-auto w-full px-4 py-8 my-auto">
    
    <!-- بطاقة التوثيق (تسجيل الدخول / إنشاء حساب) -->
    <div id="authCard" class="glass-card p-8 rounded-3xl shadow-2xl relative">
      
      <!-- Alert Message Box -->
      <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium border text-center transition-all"></div>

      <!-- قسم زر Google -->
      <div id="googleAuthSection" class="space-y-4 text-center pb-4 border-b border-slate-800">
        <p class="text-xs text-slate-400 font-medium">الدخول السريع بنقرة واحدة</p>
        <div class="flex justify-center">
          <div id="g_id_onload"
               data-client_id="821921990770-822776a7seho4i8les9lbqjsnut2lv23.apps.googleusercontent.com"
               data-callback="handleCredentialResponse"
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin" 
               data-type="standard" 
               data-size="large" 
               data-theme="outline" 
               data-text="sign_in_with"
               data-shape="rectangular"
               data-logo_alignment="left">
          </div>
        </div>
        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-slate-800"></div>
          <span class="flex-shrink mx-4 text-slate-500 text-xs">أو اسم المستخدم</span>
          <div class="flex-grow border-t border-slate-800"></div>
        </div>
      </div>

      <!-- 1. نموذج تسجيل الدخول -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 mt-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">اسم المستخدم</label>
          <input type="text" id="loginId" required placeholder="مثال: teacher1" class="w-full px-4 py-3 bg-slate-900/80 rounded-xl border border-slate-700/80 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">كلمة المرور</label>
          <input type="password" id="loginPass" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-900/80 rounded-xl border border-slate-700/80 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition">
        </div>
        <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3.5 rounded-xl font-bold transition shadow-lg shadow-blue-600/30 flex items-center justify-center">
          <span>دخول</span>
        </button>
      </form>

      <!-- 2. نموذج إنشاء حساب جديد (بدون بريد إلكتروني) -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3 mt-4 hidden">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">الاسم الأول</label>
            <input type="text" id="regFirstName" required class="w-full px-3.5 py-2.5 bg-slate-900/80 rounded-xl border border-slate-700/80 focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">الاسم الأخير</label>
            <input type="text" id="regLastName" required class="w-full px-3.5 py-2.5 bg-slate-900/80 rounded-xl border border-slate-700/80 focus:border-blue-500 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">اسم المستخدم (Username)</label>
          <input type="text" id="regUser" required placeholder="اختر اسم مستخدم فريد" class="w-full px-3.5 py-2.5 bg-slate-900/80 rounded-xl border border-slate-700/80 focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">كلمة المرور</label>
          <input type="password" id="regPass" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-900/80 rounded-xl border border-slate-700/80 focus:border-blue-500 focus:outline-none">
        </div>
        <button type="submit" id="regBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition shadow-lg shadow-blue-600/30">
          إنشاء حساب
        </button>
      </form>

    </div>
  </main>

  <!-- 3. لوحة تحكم المعلم (إدارة الفصول والطلاب) -->
  <div id="teacherDashboard" class="hidden max-w-5xl mx-auto w-full px-4 py-6">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-extrabold text-white">فصولي الدراسية</h1>
        <p class="text-slate-400 text-sm">إدارة الفصول وإضافة الطلاب للكشوفات</p>
      </div>
      <button onclick="openAddClassModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-blue-600/30 transition flex items-center gap-2">
        <span>+ إضافة فصل</span>
      </button>
    </div>

    <!-- قائمة الفصول الدراسية -->
    <div id="classesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- يتم توليد الفصول هنا ديناميكياً -->
    </div>
  </div>

  <!-- Modal: إضافة فصل جديد -->
  <div id="addClassModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="glass-card p-6 rounded-2xl max-w-sm w-full space-y-4">
      <h3 class="text-lg font-bold">إضافة فصل جديد</h3>
      <input type="text" id="classNameInput" placeholder="اسم الفصل (مثلاً: أول متوسط / 1)" class="w-full px-4 py-2.5 bg-slate-900 rounded-xl border border-slate-700 focus:outline-none focus:border-blue-500">
      <div class="flex gap-2 justify-end">
        <button onclick="closeAddClassModal()" class="px-4 py-2 text-slate-400 hover:text-white text-sm">إلغاء</button>
        <button onclick="submitCreateClass()" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-sm">حفظ</button>
      </div>
    </div>
  </div>

  <!-- Modal: إضافة طالب داخل الفصل -->
  <div id="addStudentModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="glass-card p-6 rounded-2xl max-w-sm w-full space-y-4">
      <h3 class="text-lg font-bold">إضافة طالب جديد</h3>
      <input type="text" id="studentNameInput" placeholder="اسم الطالب الثلاثي" class="w-full px-4 py-2.5 bg-slate-900 rounded-xl border border-slate-700 focus:outline-none focus:border-blue-500">
      <div class="flex gap-2 justify-end">
        <button onclick="closeAddStudentModal()" class="px-4 py-2 text-slate-400 hover:text-white text-sm">إلغاء</button>
        <button onclick="submitAddStudent()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-sm">إضافة الطالب</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="p-6 text-center text-slate-500 text-xs border-t border-slate-900">
    جميع الحقوق محفوظة منصة مُدرج © 2026
  </footer>

  <script>
    const API_URL = window.location.origin.includes('localhost') 
      ? 'http://localhost:3000' 
      : window.location.origin;

    let selectedClassId = null;

    window.onload = () => {
      const token = localStorage.getItem('userToken');
      const savedUser = localStorage.getItem('userName');
      if (token && savedUser) {
        showDashboard(savedUser);
      }
    };

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      box.innerText = msg;
      box.className = `mb-6 p-4 rounded-xl text-sm font-medium border text-center transition-all ${
        isSuccess 
          ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' 
          : 'bg-rose-500/10 border-rose-500/30 text-rose-400'
      }`;
      box.classList.remove('hidden');
    }

    function clearAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }

    function showTab(type) {
      clearAlert();
      const isLogin = type === 'login';
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('registerForm').classList.toggle('hidden', isLogin);

      document.getElementById('btnTabLogin').className = isLogin 
        ? 'px-5 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white shadow-md transition-all'
        : 'px-5 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all';

      document.getElementById('btnTabRegister').className = !isLogin 
        ? 'px-5 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white shadow-md transition-all'
        : 'px-5 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all';
    }

    // Google Auth
    async function handleCredentialResponse(response) {
      showAlert('جاري التحقق...', true);
      try {
        const res = await fetch(`${API_URL}/api/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: response.credential })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('userToken', data.token);
          localStorage.setItem('userName', data.user.firstName);
          showDashboard(data.user.firstName);
        } else {
          showAlert(data.message);
        }
      } catch (err) {
        showAlert('تعذر الاتصال بالسيرفر.');
      }
    }

    // تسجيل الدخول
    async function handleLogin(e) {
      e.preventDefault();
      clearAlert();
      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginId').value,
            password: document.getElementById('loginPass').value
          })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('userToken', data.token);
          localStorage.setItem('userName', data.user.firstName);
          showDashboard(data.user.firstName);
        } else {
          showAlert(data.message);
        }
      } catch (err) {
        showAlert('تعذر تسجيل الدخول.');
      }
    }

    // إنشاء حساب (اسم المستخدم فقط)
    async function handleRegister(e) {
      e.preventDefault();
      clearAlert();
      try {
        const res = await fetch(`${API_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName: document.getElementById('regFirstName').value,
            lastName: document.getElementById('regLastName').value,
            username: document.getElementById('regUser').value,
            password: document.getElementById('regPass').value
          })
        });
        const data = await res.json();
        if (data.success) {
          showAlert(data.message, true);
          setTimeout(() => showTab('login'), 1500);
        } else {
          showAlert(data.message);
        }
      } catch (err) {
        showAlert('حدث خطأ أثناء إنشاء الحساب.');
      }
    }

    // عرض لوحة المعلم
    function showDashboard(name) {
      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('authNavButtons').classList.add('hidden');
      document.getElementById('mainContainer').classList.remove('max-w-md', 'my-auto');
      document.getElementById('mainContainer').classList.add('max-w-5xl');
      
      document.getElementById('userHeaderInfo').classList.remove('hidden');
      document.getElementById('headerUserName').innerText = `المعلم: ${name}`;
      document.getElementById('teacherDashboard').classList.remove('hidden');
      
      loadClasses();
    }

    // جلب الفصول الخاصة بالمعلم
    async function loadClasses() {
      const token = localStorage.getItem('userToken');
      try {
        const res = await fetch(`${API_URL}/api/classes`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          renderClasses(data.classes);
        }
      } catch (err) {
        console.error('Error loading classes:', err);
      }
    }

    // عرض الفصول والطلاب في الصفحة
    function renderClasses(classes) {
      const container = document.getElementById('classesList');
      if (classes.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 glass-card rounded-2xl">
            <p class="text-slate-400 font-medium">لا توجد فصول حالياً.</p>
            <p class="text-xs text-slate-500 mt-1">اضغط على زر "+ إضافة فصل" للبدء في تنظيم طلابك.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = classes.map(cls => `
        <div class="glass-card p-5 rounded-2xl flex flex-col justify-between space-y-4">
          <div>
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-lg font-bold text-blue-400">${cls.name}</h3>
              <span class="text-xs px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg">${cls.students ? cls.students.length : 0} طلاب</span>
            </div>
            
            <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
              ${cls.students && cls.students.length > 0 ? cls.students.map(s => `
                <div class="text-xs bg-slate-900/80 px-3 py-2 rounded-lg text-slate-300 border border-slate-800 flex justify-between">
                  <span>${s.name}</span>
                </div>
              `).join('') : '<p class="text-xs text-slate-500">لا يوجد طلاب بعد</p>'}
            </div>
          </div>

          <button onclick="openAddStudentModal(${cls.id})" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition">
            + إضافة طالب
          </button>
        </div>
      `).join('');
    }

    // Modal Control
    function openAddClassModal() { document.getElementById('addClassModal').classList.remove('hidden'); }
    function closeAddClassModal() { document.getElementById('addClassModal').classList.add('hidden'); }
    
    function openAddStudentModal(classId) { 
      selectedClassId = classId;
      document.getElementById('addStudentModal').classList.remove('hidden'); 
    }
    function closeAddStudentModal() { document.getElementById('addStudentModal').classList.add('hidden'); }

    // إنشاء فصل جديد
    async function submitCreateClass() {
      const name = document.getElementById('classNameInput').value;
      if (!name) return;
      const token = localStorage.getItem('userToken');

      try {
        const res = await fetch(`${API_URL}/api/classes`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (data.success) {
          closeAddClassModal();
          document.getElementById('classNameInput').value = '';
          loadClasses();
        }
      } catch (err) {
        console.error(err);
      }
    }

    // إضافة طالب في فصل
    async function submitAddStudent() {
      const name = document.getElementById('studentNameInput').value;
      if (!name || !selectedClassId) return;
      const token = localStorage.getItem('userToken');

      try {
        const res = await fetch(`${API_URL}/api/students`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ classId: selectedClassId, name })
        });
        const data = await res.json();
        if (data.success) {
          closeAddStudentModal();
          document.getElementById('studentNameInput').value = '';
          loadClasses();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function handleLogout() {
      localStorage.removeItem('userToken');
      localStorage.removeItem('userName');
      location.reload();
    }
  </script>
</body>
</html>
